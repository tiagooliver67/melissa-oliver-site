backend:
  name: github
  repo: tiagooliver67/melissa-oliver-site
  branch: main
  base_url: https://melissa-cms-oauth.tiagooliver67.workers.dev
  auth_endpoint: auth

locale: "pt"

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "site"
    label: "Site"
    files:
      - file: "data.json"
        label: "Conteúdo do site"
        name: "conteudo"
        fields:
          - label: "Início (topo do site)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Frase de efeito", name: "eyebrow", widget: "string" }
              - { label: "Frase manuscrita (assinatura)", name: "script", widget: "text", hint: "Use uma linha em branco (Enter) para quebrar a frase em duas linhas." }
              - { label: "Texto de apresentação", name: "copy", widget: "text" }
              - { label: "Foto principal", name: "photo", widget: "image", hint: "Foto vertical (retrato), proporção aproximada 3:4. Ideal em alta resolução, a partir de 1000×1400px. A imagem é cortada automaticamente para preencher o espaço." }
              - { label: "Link do Instagram", name: "instagram_url", widget: "string" }
          - label: "Conquista"
            name: "achievement"
            widget: "object"
            fields:
              - { label: "Título (ex: 3º LUGAR)", name: "title", widget: "string" }
              - { label: "Subtítulo (ex: KATA)", name: "subtitle", widget: "string" }
              - { label: "Nome do campeonato", name: "event", widget: "string" }
              - { label: "Texto da conquista", name: "text", widget: "text" }
              - { label: "Foto da conquista", name: "photo", widget: "image", hint: "Foto horizontal (paisagem), proporção aproximada 16:9. Ideal a partir de 1200×700px. A imagem é cortada automaticamente para preencher o espaço." }
          - label: "Equipe / Quem faz parte"
            name: "team"
            widget: "list"
            summary: "{{name}} ({{role}})"
            fields:
              - { label: "Função (ex: PROFESSORA, TIO)", name: "role", widget: "string" }
              - { label: "Nome", name: "name", widget: "string" }
              - { label: "Foto", name: "photo", widget: "image", hint: "Foto no formato retrato/quadrado, proporção aproximada 3:4 a 1:1. Ideal a partir de 600×700px. A imagem é cortada automaticamente para preencher o espaço." }
          - label: "A história (linha do tempo)"
            name: "journey"
            widget: "list"
            summary: "{{label}}"
            fields:
              - { label: "Etapa (ex: TREINO, VIAGEM)", name: "label", widget: "string" }
              - { label: "Texto curto", name: "text", widget: "string" }
              - { label: "Foto", name: "photo", widget: "image", hint: "Foto pequena, formato quadrado/levemente horizontal (aprox. 1:1). Ideal a partir de 400×400px. Aparece em preto e branco automaticamente no site." }
          - label: "Galeria de momentos"
            name: "moments"
            widget: "list"
            field: { label: "Foto", name: "photo", widget: "image", hint: "Fotos horizontais. A 1ª foto aparece maior (proporção aprox. 16:9); as demais são mais estreitas (proporção aprox. 4:3). Ideal a partir de 1000×600px cada. As imagens são cortadas automaticamente para preencher o espaço." }
          - label: "Próximo desafio"
            name: "next"
            widget: "object"
            fields:
              - { label: "Texto", name: "text", widget: "text" }
              - { label: "Foto", name: "photo", widget: "image", hint: "Foto horizontal (paisagem), proporção aproximada 16:9. Ideal a partir de 1200×700px. A imagem é cortada automaticamente para preencher o espaço." }
          - label: "Contato"
            name: "contact"
            widget: "object"
            fields:
              - { label: "E-mail de contato", name: "email", widget: "string" }
              - { label: "Usuário do Instagram (ex: @melissaoliver)", name: "instagram_handle", widget: "string" }
      - file: "patrocinadores.json"
        label: "Página Patrocinadores"
        name: "patrocinadores"
        fields:
          - label: "Início (topo da página)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Texto de apresentação", name: "copy", widget: "text" }
              - { label: "Foto principal", name: "photo", widget: "image", hint: "Foto vertical/retrato. A imagem é cortada automaticamente para preencher o espaço." }
              - { label: "Local (ex: JOÃO DOURADO — BA)", name: "location", widget: "string" }
          - label: "Talento, disciplina, resultados"
            name: "story"
            widget: "object"
            fields:
              - { label: "Texto", name: "text", widget: "text" }
              - { label: "Foto", name: "photo", widget: "image", hint: "Foto vertical/retrato. A imagem é cortada automaticamente para preencher o espaço." }
              - { label: "Título da medalha (ex: 3º LUGAR — KATA)", name: "badge_title", widget: "string" }
              - { label: "Nome do campeonato", name: "badge_event", widget: "string" }
              - { label: "Frase de efeito (citação)", name: "quote", widget: "text", hint: "Pode usar <b>alguma palavra</b> para deixar em negrito e uma linha em branco para quebrar a frase." }
          - label: "Por que patrocinar (4 cartões)"
            name: "why"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Texto", name: "text", widget: "text" }
          - label: "Fotos — Onde sua marca aparece (Kimono, Camisas, Redes sociais, Eventos, nessa ordem)"
            name: "expo_photos"
            widget: "list"
            field: { label: "Foto", name: "photo", widget: "image" }
          - label: "Patrocinadores (logos)"
            name: "sponsors"
            widget: "list"
            summary: "{{name}}"
            allow_add: true
            fields:
              - { label: "Nome da empresa", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", hint: "Logo em PNG com fundo transparente funciona melhor. Enquanto não houver patrocinadores cadastrados aqui, a página mostra os quadros \"SUA MARCA\" de exemplo." }
          - label: "Planos de patrocínio (4 planos)"
            name: "plans"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Nome do plano", name: "title", widget: "string" }
              - label: "Benefícios (um por linha)"
                name: "bullets"
                widget: "list"
                field: { label: "Benefício", name: "item", widget: "string" }
          - label: "Chamada final (Vamos juntos?)"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Texto", name: "text", widget: "text" }
              - { label: "Foto", name: "photo", widget: "image", hint: "Foto vertical/retrato. A imagem é cortada automaticamente para preencher o espaço." }
          - label: "Contato"
            name: "contact"
            widget: "object"
            fields:
              - { label: "WhatsApp (com DDD, só números)", name: "whatsapp", widget: "string", hint: "Ex: 74999758969" }
              - { label: "Usuário do Instagram (sem @)", name: "instagram_handle", widget: "string" }
              - { label: "E-mail de contato", name: "email", widget: "string" }
